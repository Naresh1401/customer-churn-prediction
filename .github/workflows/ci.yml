name: CI — Customer Churn Prediction

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 src/ api/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings
          flake8 src/ api/ tests/ --count --max-complexity=10 --max-line-length=120 --statistics --exit-zero

      - name: Generate synthetic data
        run: python -m src.generate_data

      - name: Run pytest (unit tests only — skip model-dependent tests)
        run: |
          pytest tests/ -v -k "not TestModelPrediction and not TestAPI" --tb=short
